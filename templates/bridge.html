cat > ~/smartband-bridge-hosting/public/index.html << 'BRIDGE_EOF'
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smartband Bridge — Health Monitor HSHL</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --good: #4ade80;
    --bad: #f87171;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    min-height: 100vh;
  }
  h1 { font-size: 20px; margin: 0 0 4px 0; }
  p.subtitle { color: var(--muted); margin: 0 0 20px 0; font-size: 14px; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155;
    background: #0f172a; color: var(--text); font-size: 15px;
  }
  button {
    width: 100%; padding: 14px; border-radius: 10px; border: none;
    font-size: 16px; font-weight: 600; margin-top: 10px; cursor: pointer;
  }
  #connectBtn { background: var(--accent); color: #0f172a; }
  #connectBtn:disabled { background: #334155; color: var(--muted); }
  #disconnectBtn { background: transparent; color: var(--bad); border: 1px solid var(--bad); display: none; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--good); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .stat { background: #0f172a; border-radius: 10px; padding: 12px; text-align: center; }
  .stat .val { font-size: 24px; font-weight: 700; color: var(--accent); }
  .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }
  #log {
    font-family: monospace; font-size: 12px; color: var(--muted);
    background: #0f172a; border-radius: 8px; padding: 10px; height: 140px;
    overflow-y: auto; white-space: pre-wrap;
  }
</style>
</head>
<body>

<h1>Smartband Bridge</h1>
<p class="subtitle">Health Monitor HSHL — Rev1 BLE → Firestore</p>

<div class="card">
  <label for="patientId">Patient ID</label>
  <input type="text" id="patientId" placeholder="e.g. p001" value="p001">

  <div class="status" style="margin-top:14px;">
    <div class="dot" id="bleDot"></div>
    <span id="bleStatus">Not connected</span>
  </div>
  <div class="status">
    <div class="dot" id="fbDot"></div>
    <span id="fbStatus">Firestore not initialized</span>
  </div>

  <button id="connectBtn">Connect to Band</button>
  <button id="disconnectBtn">Disconnect</button>
</div>

<div class="card">
  <div class="grid">
    <div class="stat"><div class="val" id="valTemp">--</div><div class="lbl">Temp °C</div></div>
    <div class="stat"><div class="val" id="valAccel">--</div><div class="lbl">Accel X (mg)</div></div>
    <div class="stat"><div class="val" id="valBpm">--</div><div class="lbl">Heart Rate (BPM)</div></div>
    <div class="stat"><div class="val" id="valWorn">--</div><div class="lbl">Worn</div></div>
  </div>
</div>

<div class="card">
  <label>Log</label>
  <div id="log"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, doc, setDoc, collection, addDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDNS4fJ_3v-tyDauYirDf3k8oqu4UdfviM",
    authDomain: "health-monitor-hshl.firebaseapp.com",
    projectId: "health-monitor-hshl",
    storageBucket: "health-monitor-hshl.firebasestorage.app",
    messagingSenderId: "566200356029",
    appId: "1:566200356029:web:f863afa7de94bb50bd3bd4"
  };

  const fbApp = initializeApp(firebaseConfig);
  const db = getFirestore(fbApp);

  const fbDot = document.getElementById("fbDot");
  const fbStatus = document.getElementById("fbStatus");
  fbDot.classList.add("on");
  fbStatus.textContent = "Firestore ready";

  const SERVICE_UUID = 0xfff0;
  const CHAR1_TEMP_UUID = 0xfff1;
  const CHAR2_ACCEL_UUID = 0xfff2;  
  const CHAR4_HR_WORN_UUID = 0xfff4;
  const CHAR5_IR_UUID = 0xfff5;

  let bleDevice = null;
  let bleServer = null;
  let pollTimer = null;

  const latest = { accel_x: null, temp: null, bpm: null, worn: null };

  const bleDot = document.getElementById("bleDot");
  const bleStatus = document.getElementById("bleStatus");
  const connectBtn = document.getElementById("connectBtn");
  const disconnectBtn = document.getElementById("disconnectBtn");
  const logEl = document.getElementById("log");

  function log(msg) {
    const t = new Date().toLocaleTimeString();
    logEl.textContent += `[${t}] ${msg}\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setBleConnected(connected) {
    bleDot.classList.toggle("on", connected);
    bleStatus.textContent = connected ? "Connected to band" : "Not connected";
    connectBtn.style.display = connected ? "none" : "block";
    disconnectBtn.style.display = connected ? "block" : "none";
  }

  function updateDisplay() {
    document.getElementById("valTemp").textContent = latest.temp !== null ? latest.temp : "--";
    document.getElementById("valAccel").textContent = latest.accel_x !== null ? latest.accel_x : "--";
    document.getElementById("valBpm").textContent = latest.bpm !== null ? latest.bpm : "--";
    document.getElementById("valWorn").textContent = latest.worn === null ? "--" : (latest.worn ? "Yes" : "No");
  }

  async function pushReading() {
    const patientId = document.getElementById("patientId").value.trim();
    if (!patientId) return;
    const reading = {
      accel_x: latest.accel_x,
      temp: latest.temp,
      bpm: latest.bpm,
      worn: latest.worn,
      timestamp: serverTimestamp(),
      source: "bluefy_bridge"
    };
    try {
      await addDoc(collection(db, "patients", patientId, "readings"), reading);
      await setDoc(doc(db, "patients", patientId), { last_reading: reading }, { merge: true });
      log(`Pushed reading for ${patientId}`);
    } catch (e) {
      log(`Firestore write failed: ${e.message}`);
    }
  }

  async function connect() {
    try {
      log("Requesting device...");
      bleDevice = await navigator.bluetooth.requestDevice({
        filters: [{ services: [SERVICE_UUID] }]
      });

      bleDevice.addEventListener("gattserverdisconnected", onDisconnected);

      log(`Connecting to ${bleDevice.name || "device"}...`);
      bleServer = await bleDevice.gatt.connect();

      const service = await bleServer.getPrimaryService(SERVICE_UUID);

      const char4 = await service.getCharacteristic(CHAR4_HR_WORN_UUID);
      await char4.startNotifications();
      char4.addEventListener("characteristicvaluechanged", (event) => {
        const value = event.target.value;
        latest.bpm = value.getUint8(0);
        latest.worn = value.getUint8(1) === 1;
        updateDisplay();
        pushReading();
      });

      setBleConnected(true);
      log("Connected. Notifications active on CHAR4.");

      pollTimer = setInterval(async () => {
        try {
          const c1 = await service.getCharacteristic(CHAR1_TEMP_UUID);
          const v1 = await c1.readValue();
          latest.temp = v1.getUint8(0);

          const c2 = await service.getCharacteristic(CHAR2_ACCEL_UUID);
          const v2 = await c2.readValue();
          latest.accel_x = v2.getInt16(0, false); 

          updateDisplay();
          pushReading();
        } catch (e) {
          log(`Poll read failed: ${e.message}`);
        }
      }, 5000);

    } catch (e) {
      log(`Connection failed: ${e.message}`);
      setBleConnected(false);
    }
  }

  function onDisconnected() {
    log("Device disconnected.");
    setBleConnected(false);
    if (pollTimer) clearInterval(pollTimer);
  }

  async function disconnect() {
    if (pollTimer) clearInterval(pollTimer);
    if (bleDevice && bleDevice.gatt.connected) {
      bleDevice.gatt.disconnect();
    }
    setBleConnected(false);
  }

  connectBtn.addEventListener("click", connect);
  disconnectBtn.addEventListener("click", disconnect);

  if (!navigator.bluetooth) {
    log("Web Bluetooth not available in this browser. Open this page in Bluefy on iPhone.");
    connectBtn.disabled = true;
    connectBtn.textContent = "Bluetooth not supported";
  }
</script>

</body>
</html>
BRIDGE_EOF
